<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fefefe" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NADOK" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>NADOK</title>
    <!-- 홈 화면에 설치한 앱(standalone)인지 브라우저인지 표시: 상태바·홈 인디케이터 여백 결정 (_reset.scss) -->
    <script>
      (function () {
        var standalone =
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true
        document.documentElement.classList.add(standalone ? 'is-standalone' : 'is-browser')
      })()
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 화면별 가장 큰 요소(LCP)인 배경 이미지는 CSS background-image라 JS·CSS가 로드된 뒤에야 요청되므로,
         들어온 주소에 맞는 배경만 HTML에서 미리 요청 (다른 화면에서는 요청하지 않아 'preload 후 미사용' 경고 없음) -->
    <script>
      ;(function () {
        var backgrounds = {
          '/': '/assets/onBoarding/onboardMain.webp',
          '/home': '/assets/library/library_main.webp',
          '/search': '/assets/library/library_main.webp',
          '/character': '/assets/character/bg.webp',
          '/chat': '/assets/chatPage/chat_bg2.webp',
        }
        var href = backgrounds[location.pathname]
        if (!href) return
        var link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'image'
        link.type = 'image/webp'
        link.href = href
        link.setAttribute('fetchpriority', 'high')
        document.head.appendChild(link)
      })()
    </script>
    <link rel="preload" href="/assets/fonts/TropiLand-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/tvNEnjoystories-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
