<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fefefe" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NADOK" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>NADOK</title>
    <!-- 홈 화면에 설치한 앱(standalone)인지 브라우저인지 표시: 상태바·홈 인디케이터 여백 결정 (_reset.scss) -->
    <script>
      (function () {
        var standalone =
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true
        document.documentElement.classList.add(standalone ? 'is-standalone' : 'is-browser')
      })()
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 첫 화면(스플래시) 배경: CSS background-image라 늦게 발견되므로 미리 요청.
         스플래시('/')로 들어올 때만 요청해 다른 화면에서 'preload 후 미사용' 경고가 나지 않게 함 -->
    <script>
      if (location.pathname === '/') {
        var splashBg = document.createElement('link')
        splashBg.rel = 'preload'
        splashBg.as = 'image'
        splashBg.type = 'image/webp'
        splashBg.href = '/assets/onBoarding/onboardMain.webp'
        splashBg.setAttribute('fetchpriority', 'high')
        document.head.appendChild(splashBg)
      }
    </script>
    <link rel="preload" href="/assets/fonts/TropiLand-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/tvNEnjoystories-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
